syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service CheckpointsService {
  rpc checkpointRestore(CheckpointRestoreRequest) returns (Empty);
  // Opens a multi-file diff of everything that changed between the latest
  // checkpoint (snapshotted when the user's last message started a run) and
  // the current working tree.
  rpc checkpointViewLatestChanges(EmptyRequest) returns (Empty);
  // Summary of files/lines changed between a checkpoint and the current working
  // tree (empty when no checkpoint exists). Omit both selectors for the latest
  // checkpoint; pass message_ts to target the checkpoint for that user message.
  rpc checkpointLatestChangesSummary(CheckpointChangesSummaryRequest) returns (LatestChangesSummary);
  // Opens a single-file diff for one file from the latest checkpoint comparison.
  rpc checkpointOpenFileDiff(OpenFileDiffRequest) returns (Empty);
}

message CheckpointRestoreRequest {
  Metadata metadata = 1;
  int64 number = 2;
  string restore_type = 3;
  optional int64 offset = 4;
}

message CheckpointChangesSummaryRequest {
  Metadata metadata = 1;
  optional int64 checkpoint_run_count = 2;
  optional int64 message_ts = 3;
}

message ChangedFileSummary {
  string file_path = 1;
  string relative_path = 2;
  int32 added_lines = 3;
  int32 removed_lines = 4;
  string status = 5;
}

message LatestChangesSummary {
  repeated ChangedFileSummary files = 1;
  int32 total_added = 2;
  int32 total_removed = 3;
  int64 checkpoint_run_count = 4;
}

message OpenFileDiffRequest {
  string file_path = 1;
  int64 checkpoint_run_count = 2;
}
