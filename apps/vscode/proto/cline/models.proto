syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

// Service for model-related operations
service ModelsService {
  // Returns the caller's remaining Pliny gateway budget
  rpc getPlinyBudget(EmptyRequest) returns (PlinyBudgetResponse);
  // Updates API configuration (legacy - uses combined configuration)
  rpc updateApiConfigurationProto(UpdateApiConfigurationRequest) returns (Empty);
  // Lists providers available from the unified SDK-backed catalog
  rpc listProviders(Empty) returns (ProviderListingsResponse);
  // Resolves model metadata for a provider through the unified SDK-backed catalog
  rpc resolveProviderModels(ResolveProviderModelsRequest) returns (ProviderModelsResponse);
  // Resolves model metadata for a provider/model without refreshing model lists
  rpc resolveModelInfo(ResolveModelInfoRequest) returns (ResolveModelInfoResponse);
  // Reads redacted effective provider configuration
  rpc readProviderConfig(StringRequest) returns (ProviderConfigResponse);
  // Writes provider configuration fields and returns redacted effective configuration
  rpc writeProviderConfig(WriteProviderConfigRequest) returns (ProviderConfigResponse);
  // Commits a mode-specific model ID with optional user-authored metadata overrides
  rpc commitModelSelection(CommitModelSelectionRequest) returns (Empty);
}

// Price tier for tiered pricing models
message PriceTier {
  int64 token_limit = 1; // Upper limit (inclusive) of input tokens for this price
  double price = 2; // Price per million tokens for this tier
}

// Thinking configuration for models that support thinking/reasoning
message ThinkingConfig {
  optional int64 max_budget = 1; // Max allowed thinking budget tokens
  optional double output_price = 2; // Output price per million tokens when budget > 0
  repeated PriceTier output_price_tiers = 3; // Optional: Tiered output price when budget > 0
}

// Model tier for tiered pricing structures
message ModelTier {
  int64 context_window = 1;
  optional double input_price = 2;
  optional double output_price = 3;
  optional double cache_writes_price = 4;
  optional double cache_reads_price = 5;
}

// For OpenRouterCompatibleModelInfo structure in OpenRouterModels
message OpenRouterModelInfo {
  optional int64 max_tokens = 1;
  optional int64 context_window = 2;
  optional bool supports_images = 3;
  bool supports_prompt_cache = 4;
  optional double input_price = 5;
  optional double output_price = 6;
  optional double cache_writes_price = 7;
  optional double cache_reads_price = 8;
  optional string description = 9;
  optional ThinkingConfig thinking_config = 10;
  optional bool supports_global_endpoint = 11;
  repeated ModelTier tiers = 12;
  optional string name = 13;
  optional double temperature = 14;
  optional bool supports_reasoning = 15;
  optional ApiFormat api_format = 16;
  // Parameter counts in billions; active < total for mixture-of-experts models.
  optional double params_total_b = 17;
  optional double params_active_b = 18;
  // True when no price is known: input/output_price then read 0 but mean "unknown", not "free".
  optional bool pricing_unavailable = 19;
  // Where the price comes from, or how a router is billed.
  optional string pricing_note = 20;
}

// User-authored per-model metadata stored in models.json.
//
// Semantics:
//  - `capabilities` accepts only the SDK ModelCapability values (e.g.
//    "images", "tools", "prompt-cache", "reasoning", "files"); unknown
//    strings are silently dropped by the host. The array is additive over
//    the base metadata; the explicit supports_* booleans win when both are
//    present.
//  - Invalid numbers (non-positive token limits, negative prices or
//    temperature, non-finite values) are silently discarded, not rejected.
message ModelOverrides {
  // Field 15 was the removed legacy `is_r1_format_required` alias.
  reserved 15;
  reserved "is_r1_format_required";

  optional string name = 1;
  optional int64 max_tokens = 2;
  optional int64 context_window = 3;
  optional int64 max_input_tokens = 4;
  repeated string capabilities = 5;
  optional bool supports_vision = 6;
  optional bool supports_attachments = 7;
  optional bool supports_reasoning = 8;
  optional double input_price = 9;
  optional double output_price = 10;
  optional double cache_reads_price = 11;
  optional double cache_writes_price = 12;
  optional double temperature = 13;
  optional ApiFormat api_format = 14;
}

// Lightweight provider entry for the top-level model/provider picker.
// Does not include the full model list; use resolveProviderModels for models.
message ProviderListing {
  string id = 1;
  string name = 2;
  optional string default_model_id = 3;
  optional string family = 4;
  optional string protocol = 5;
  optional string auth_description = 6;
  optional string base_url_description = 7;
  bool allows_custom_model_ids = 8;

  // SDK-driven hint for cost display. Values: "show" (default) or "hide".
  // Sourced from `resolveProviderUsageCostDisplay(provider.metadata)` in
  // `@plinycode/llms`. When "hide", consumers must suppress per-token pricing
  // and total cost displays (matches the CLI's `shouldShowCliUsageCost`).
  string usage_cost_display = 11;
}

message ProviderListingsResponse {
  repeated ProviderListing providers = 1;
}

message ResolveProviderModelsRequest {
  string provider_id = 1;
  bool force_refresh = 2;
  optional string request_id = 3;
}

message CatalogErrorInfo {
  string kind = 1;
  string message = 2;
  optional string code = 3;
  optional bool retryable = 4;
}

message ProviderModelsResponse {
  string provider_id = 1;
  string request_id = 2;
  string config_fingerprint = 3;
  int64 fetched_at = 4;
  bool ok = 5;
  map<string, OpenRouterModelInfo> models = 6;
  optional string default_model_id = 7;
  optional string source = 8;
  optional CatalogErrorInfo error = 9;
}

message ResolveModelInfoRequest {
  string provider_id = 1;
  optional string model_id = 2;
}

message ResolveModelInfoResponse {
  string provider_id = 1;
  string model_id = 2;
  optional OpenRouterModelInfo model_info = 3;
  string source = 4;
}

message AwsProviderConfig {
  optional string authentication = 1;
  optional string profile = 2;
  optional string access_key = 3;
  int64 access_key_length = 4;
  optional string secret_key = 5;
  int64 secret_key_length = 6;
  optional string session_token = 7;
  int64 session_token_length = 8;
  optional string endpoint = 9;
  optional bool use_prompt_cache = 10;
  optional string custom_model_base_id = 11;
  optional bool use_cross_region_inference = 12;
  optional bool use_global_inference = 13;
}

message GcpProviderConfig {
  optional string project_id = 1;
  optional string region = 2;
}

message ProviderConfigResponse {
  string provider_id = 1;
  optional string base_url = 2;
  optional string api_line = 3;
  map<string, string> headers = 4;
  optional string region = 5;
  int64 api_key_length = 6;
  bool has_access_token = 7;
  bool has_refresh_token = 8;
  optional string account_id = 9;
  optional CommittedModelSelection plan_selection = 10;
  optional CommittedModelSelection act_selection = 11;
  optional AwsProviderConfig aws = 12;
  optional GcpProviderConfig gcp = 13;
  // Provider-level context window (providers.json `contextWindow`). Used by
  // bring-your-own-model providers (e.g. Ollama, where it maps to num_ctx).
  optional int32 context_window = 14;
}

message CommittedModelSelection {
  string provider_id = 1;
  string model_id = 2;
  OpenRouterModelInfo model_info = 3;
  optional ModelOverrides overrides = 4;
}

message ProviderReasoningPatch {
  optional bool enabled = 1;
  optional string effort = 2; // "none" | "low" | "medium" | "high" | "xhigh"
  optional int32 budget_tokens = 3;
}

message WriteProviderConfigPatch {
  optional string api_key = 1;
  optional string base_url = 2;
  map<string, string> headers = 3;
  optional string region = 4;
  optional string api_line = 5;
  optional string access_token = 6;
  optional string refresh_token = 7;
  optional string account_id = 8;
  optional ProviderReasoningPatch reasoning = 9;
  optional bool clear_headers = 10;
  optional AwsProviderConfig aws = 11;
  optional GcpProviderConfig gcp = 12;
  // Provider-level context window; 0 clears the setting.
  optional int32 context_window = 13;
}

message WriteProviderConfigRequest {
  string provider_id = 1;
  WriteProviderConfigPatch patch = 2;
}

message CommitModelSelectionRequest {
  // Field 4 carried `OpenRouterModelInfo model_info` in earlier releases.
  // Reusing the number with a different message type mis-decodes on version
  // skew, so the retired field stays reserved.
  reserved 4;
  reserved "model_info";
  string provider_id = 1;
  string mode = 2;
  string model_id = 3;
  // Tri-state: ABSENT leaves the model's stored overrides unchanged, an
  // explicitly EMPTY message clears them, and a populated message replaces
  // them wholesale (no per-field merge).
  optional ModelOverrides overrides = 5;
}

// The binding Pliny gateway budget (the period with the least money left)
message PlinyBudgetResponse {
  // False when there is no API key, the gateway is unreachable or reports no budget
  bool available = 1;
  double limit = 2;
  double used = 3;
  double remaining = 4;
  double percentage = 5;
  // Gateway period key, e.g. "cost_per_month"
  string period = 6;
  int64 period_end_ms = 7;
  bool is_blocked = 8;
  string error = 9;
}

// Request for updating API configuration (legacy - uses combined configuration)
message UpdateApiConfigurationRequest {
  Metadata metadata = 1;
  ModelsApiConfiguration api_configuration = 2;
}

// Model info for OCA (OpenAI-compatible) models exposed by the OCA provider
message OcaModelInfo {
  // Maximum completion tokens per request supported by this model
  optional int64 max_tokens = 1;
  // Total context window in tokens (input + output)
  optional int64 context_window = 2;
  // Whether the model supports image inputs
  optional bool supports_images = 3;
  // Whether prompt caching is supported for this model
  bool supports_prompt_cache = 4;
  // Price per million input tokens (USD unless otherwise specified by provider)
  optional double input_price = 5;
  // Price per million output tokens (USD unless otherwise specified by provider)
  optional double output_price = 6;
  // Thinking/reasoning configuration if the model supports it
  optional ThinkingConfig thinking_config = 7;
  // Price per million tokens for prompt cache writes
  optional double cache_writes_price = 9;
  // Price per million tokens for prompt cache reads
  optional double cache_reads_price = 10;
  // Human-readable model description
  optional string description = 11;
  // Recommended default temperature for this model
  optional double temperature = 13;
  // Optional survey content to display in the UI
  optional string survey_content = 14;
  // Identifier for the survey associated with this model
  optional string survey_id = 15;
  // Optional banner content (e.g., deprecation or promotion notes)
  optional string banner = 16;
  // Canonical model identifier as reported by OCA
  string model_name = 17;
  // The API format used by this model
  optional ApiFormat api_format = 18;
  // Supports reasoning
  optional bool supports_reasoning = 19;
  // reasoning effort options
  repeated string reasoning_effort_options = 20;
}

enum ApiFormat {
  ANTHROPIC_CHAT = 0;
  GEMINI_CHAT = 1;
  OPENAI_CHAT = 2;
  R1_CHAT = 3;
  OPENAI_RESPONSES = 4;
  OPENAI_RESPONSES_WEBSOCKET_MODE = 5;
}

// Main ApiConfiguration message
message ModelsApiConfiguration {
  // Settings of the providers PlinyCode no longer has.
  reserved 1, 4 to 59, 61 to 72, 74 to 75, 77 to 87, 104 to 130, 134 to 139, 204 to 230, 234 to 239;
  reserved "api_key", "lite_llm_base_url", "lite_llm_api_key", "lite_llm_use_prompt_cache", "open_ai_headers", "anthropic_base_url", "open_router_api_key", "open_router_provider_sorting", "aws_access_key", "aws_secret_key", "aws_session_token", "aws_region", "aws_use_cross_region_inference", "aws_bedrock_use_prompt_cache", "aws_use_profile", "aws_profile", "aws_bedrock_endpoint", "claude_code_path", "vertex_project_id", "vertex_region", "open_ai_base_url", "open_ai_api_key", "ollama_base_url", "ollama_api_options_ctx_num", "lm_studio_base_url", "gemini_api_key", "gemini_base_url", "open_ai_native_api_key", "deep_seek_api_key", "requesty_api_key", "requesty_base_url", "together_api_key", "fireworks_api_key", "fireworks_model_max_completion_tokens", "fireworks_model_max_tokens", "qwen_api_key", "doubao_api_key", "mistral_api_key", "azure_api_version", "qwen_api_line", "nebius_api_key", "asksage_api_url", "asksage_api_key", "xai_api_key", "sambanova_api_key", "cerebras_api_key", "request_timeout_ms", "sap_ai_core_client_id", "sap_ai_core_client_secret", "sap_ai_resource_group", "sap_ai_core_token_url", "sap_ai_core_base_url", "sap_ai_core_use_orchestration_mode", "moonshot_api_key", "moonshot_api_line", "aws_authentication", "aws_bedrock_api_key", "groq_api_key", "hugging_face_api_key", "huawei_cloud_maas_api_key", "baseten_api_key", "ollama_api_key", "zai_api_key", "zai_api_line", "lm_studio_max_tokens", "vercel_ai_gateway_api_key", "qwen_code_oauth_path", "dify_api_key", "dify_base_url", "oca_api_key", "oca_refresh_token", "aws_use_global_inference", "minimax_api_key", "minimax_api_line", "hicap_model_id", "hicap_api_key", "aihubmix_api_key", "aihubmix_base_url", "aihubmix_app_code", "nous_research_api_key", "azure_identity", "wandb_api_key", "plan_mode_vs_code_lm_model_selector", "plan_mode_aws_bedrock_custom_selected", "plan_mode_aws_bedrock_custom_model_base_id", "plan_mode_open_router_model_id", "plan_mode_open_router_model_info", "plan_mode_open_ai_model_id", "plan_mode_open_ai_model_info", "plan_mode_ollama_model_id", "plan_mode_lm_studio_model_id", "plan_mode_lite_llm_model_id", "plan_mode_lite_llm_model_info", "plan_mode_requesty_model_id", "plan_mode_requesty_model_info", "plan_mode_together_model_id", "plan_mode_fireworks_model_id", "plan_mode_sap_ai_core_model_id", "plan_mode_sap_ai_core_deployment_id", "plan_mode_groq_model_id", "plan_mode_groq_model_info", "plan_mode_hugging_face_model_id", "plan_mode_hugging_face_model_info", "plan_mode_huawei_cloud_maas_model_id", "plan_mode_huawei_cloud_maas_model_info", "plan_mode_baseten_model_id", "plan_mode_baseten_model_info", "plan_mode_vercel_ai_gateway_model_id", "plan_mode_vercel_ai_gateway_model_info", "plan_mode_hicap_model_id", "plan_mode_hicap_model_info", "plan_mode_aihubmix_model_id", "plan_mode_aihubmix_model_info", "plan_mode_nous_research_model_id", "gemini_plan_mode_thinking_level", "act_mode_vs_code_lm_model_selector", "act_mode_aws_bedrock_custom_selected", "act_mode_aws_bedrock_custom_model_base_id", "act_mode_open_router_model_id", "act_mode_open_router_model_info", "act_mode_open_ai_model_id", "act_mode_open_ai_model_info", "act_mode_ollama_model_id", "act_mode_lm_studio_model_id", "act_mode_lite_llm_model_id", "act_mode_lite_llm_model_info", "act_mode_requesty_model_id", "act_mode_requesty_model_info", "act_mode_together_model_id", "act_mode_fireworks_model_id", "act_mode_sap_ai_core_model_id", "act_mode_sap_ai_core_deployment_id", "act_mode_groq_model_id", "act_mode_groq_model_info", "act_mode_hugging_face_model_id", "act_mode_hugging_face_model_info", "act_mode_huawei_cloud_maas_model_id", "act_mode_huawei_cloud_maas_model_info", "act_mode_baseten_model_id", "act_mode_baseten_model_info", "act_mode_vercel_ai_gateway_model_id", "act_mode_vercel_ai_gateway_model_info", "act_mode_hicap_model_id", "act_mode_hicap_model_info", "act_mode_aihubmix_model_id", "act_mode_aihubmix_model_info", "act_mode_nous_research_model_id", "gemini_act_mode_thinking_level";

  optional string cline_api_key = 2;
  optional string ulid = 3;
  optional string cline_account_id = 60;
  optional string oca_base_url = 73;
  optional string oca_mode = 76;
  optional string plan_mode_api_provider = 100;
  optional string plan_mode_api_model_id = 101;
  optional int64 plan_mode_thinking_budget_tokens = 102;
  optional string plan_mode_reasoning_effort = 103;
  optional string plan_mode_oca_model_id = 131;
  optional OcaModelInfo plan_mode_oca_model_info = 132;
  optional string plan_mode_oca_reasoning_effort = 133;
  optional string plan_mode_cline_model_id = 140;
  optional OpenRouterModelInfo plan_mode_cline_model_info = 141;
  optional string plan_mode_cline_pass_model_id = 142;
  optional OpenRouterModelInfo plan_mode_cline_pass_model_info = 143;
  optional string act_mode_api_provider = 200;
  optional string act_mode_api_model_id = 201;
  optional int64 act_mode_thinking_budget_tokens = 202;
  optional string act_mode_reasoning_effort = 203;
  optional string act_mode_oca_model_id = 231;
  optional OcaModelInfo act_mode_oca_model_info = 232;
  optional string act_mode_oca_reasoning_effort = 233;
  optional string act_mode_cline_model_id = 240;
