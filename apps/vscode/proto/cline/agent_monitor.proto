syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service AgentMonitorService {
  rpc subscribeToAgents(EmptyRequest) returns (stream AgentMonitorsState);
  rpc configureAgentMonitor(AgentMonitorSettings) returns (String);
  rpc refreshAgentMonitor(StringRequest) returns (Empty);
  rpc removeAgentMonitor(StringRequest) returns (Empty);
  rpc getGrafanaSettings(EmptyRequest) returns (String);
  rpc configureGrafana(StringRequest) returns (String);
  rpc setGrafanaToken(EmptyRequest) returns (String);
  rpc removeGrafanaToken(EmptyRequest) returns (String);
  rpc inspectGrafana(EmptyRequest) returns (String);
  rpc queryAgentMetrics(AgentMetricsRequest) returns (String);
}

message AgentMonitorSettings {
  Metadata metadata = 1;
  string queue_url = 2;
  repeated string capabilities = 3;
  string authentication = 4;
  bool enabled = 5;
  bool notify = 6;
  string id = 7;
}

message AgentMonitorsState {
  repeated AgentMonitorState pools = 1;
  string error = 2;
  string default_authentication = 3;
}

message AgentMonitorState {
  AgentMonitorSettings config = 1;
  string pool_name = 2;
  repeated MonitoredAgentInfo agents = 3;
  int32 total = 4;
  int64 updated = 5;
  bool refreshing = 6;
  string error = 7;
  string id = 8;
}

message MonitoredAgentInfo {
  int64 id = 1;
  string name = 2;
  string status = 3;
  bool enabled = 4;
  bool busy = 5;
  repeated string capabilities = 6;
  string url = 7;
  string job_name = 8;
  string job_url = 9;
  string pipeline_name = 10;
  string run_name = 11;
  string os = 12;
  AgentUtilizationInfo utilization = 13;
  string hostname = 14;
}

message AgentMetricsRequest {
  Metadata metadata = 1;
  string host = 2;
  string range = 3;
}

message AgentUtilizationInfo {
  int64 busy_ms = 1;
  int64 observed_ms = 2;
}
