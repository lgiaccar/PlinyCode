message State {
  string state_json = 1;
}

message TerminalProfiles {
  repeated TerminalProfile profiles = 1;
}

message TerminalProfile {
  string id = 1;
  string name = 2;
  optional string path = 3;
  optional string description = 4;
}

message TerminalProfileUpdateResponse {
  int32 closed_count = 1;
  int32 busy_terminals_count = 2;
  bool has_busy_terminals = 3;
}

message TogglePlanActModeRequest {
  Metadata metadata = 1;
  PlanActMode mode = 2;
  optional ChatContent chat_content = 3;
  // Execute plan only: the model to run the plan on, as a PlanExecutionChoice
  // ("actModel", "freeAuto", "balanceAuto", "planModel"). Act mode is switched
  // to it before the mode changes, and the choice is remembered.
  optional string execute_plan_with = 4;
}

enum PlanActMode {
  PLAN = 0;
  ACT = 1;
  // Read-only question answering: no file edits.
  ASK_MODE = 2;
}

enum OpenaiReasoningEffort {
  LOW = 0;
  MEDIUM = 1;
  HIGH = 2;
  reserved 3; // was MINIMAL
}

enum McpDisplayMode {
  RICH = 0;
  PLAIN = 1;
  MARKDOWN = 2;
}

message ChatContent {
  optional string message = 1;
  repeated string images = 2;
  repeated string files = 3;
}

message ResetStateRequest {
  Metadata metadata = 1;
  optional bool global = 2;
}

message AutoApprovalSettingsRequest {
  Metadata metadata = 1;
  int32 version = 2;
  AutoApprovalActions actions = 3;
  bool enable_notifications = 4;
}

// Message for updating settings
message UpdateSettingsRequest {
  reserved 15; // was openai_reasoning_effort (moved to mode-scoped reasoning effort)
  reserved 23; // was dictation_settings (dictation removed)
  reserved 32, 34, 35, 41;
  reserved 38; // was skills_enabled (removed - now always enabled)
  reserved 43; // was lazy_teammate_mode_enabled (removed)
  reserved 40; // was worktrees_enabled (worktrees removed)
  reserved 20; // was browser_settings (browser tool removed)
  reserved 6; // was mcp_marketplace_enabled (MCP Marketplace removed)
  reserved 12; // was terminal_output_line_limit (removed; SDK command output limits are character-based)
  reserved 19; // was custom_prompt (removed - compact prompt setting no longer supported)
  reserved 3; // was telemetry_setting (telemetry removed)
  reserved 33; // was onboarding_models (Cline onboarding model list removed)
  reserved "onboarding_models";
  reserved 39; // was opt_out_of_remote_config (remote config removed)
  reserved "native_tool_call_enabled", "cline_web_tools_enabled", "enable_parallel_tool_calling", "double_check_completion_enabled", "custom_prompt", "telemetry_setting", "worktrees_enabled", "browser_settings", "mcp_marketplace_enabled", "opt_out_of_remote_config";

  Metadata metadata = 1;
  optional ModelsApiConfiguration api_configuration = 2;
  optional bool plan_act_separate_models_setting = 4;
  optional bool enable_checkpoints_setting = 5;
  optional int32 shell_integration_timeout = 8;
  optional bool terminal_reuse_enabled = 9;
  optional bool mcp_responses_collapsed = 10;
  optional McpDisplayMode mcp_display_mode = 11;
  optional PlanActMode mode = 13;
  optional string preferred_language = 14;
  reserved 16; // was strict_plan_mode_enabled (removed)
  reserved 17; // was focus_chain_settings (unread; no UI ever wrote or read it)
  optional bool use_auto_condense = 18;
  optional string default_terminal_profile = 21;
  reserved 22; // was yolo_mode_toggled (removed; migrated into auto_approval_settings)
  reserved 25; // was multi_root_enabled (unread; no UI ever read it)
  optional bool hooks_enabled = 26;
  optional string vscode_terminal_execution_mode = 27;
  reserved 28; // was max_consecutive_mistakes (removed; the SDK owns the mistake limit)
  optional bool subagents_enabled = 29;
  optional int32 subagent_terminal_output_line_limit = 30;
  optional string cline_env = 31;
  optional bool background_edit_enabled = 36;
  optional string oca_reasoning_effort = 37;
  optional bool show_feature_tips = 42;
  optional string compaction_strategy = 44;
  optional bool web_search_enabled = 45;
  optional bool prerelease_updates_enabled = 46;
  optional int32 chat_input_max_rows = 47;
  // plinycode.spending.conversationLimit: the default conversation budget, in USD; 0 turns the limit off
  optional double conversation_spending_limit = 48;
  // plinycode.memory.maxTokens: the memory budget in the system prompt, in tokens; 0 turns memory off
  optional int32 memory_max_tokens = 49;
  // plinycode.memory.distill: offer memories to save after a run ("offer") or only on /distill ("off")
  optional bool memory_distill_enabled = 50;
  // plinycode.memory.conversationSearch: the search_conversations and read_conversation tools
  optional bool memory_conversation_search_enabled = 51;
}

message UpdateTerminalConnectionTimeoutRequest {
  optional int32 timeout_ms = 1;
}

message UpdateTerminalConnectionTimeoutResponse {
  optional int32 timeout_ms = 1;
}
