syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

// The CI board: pull requests and branches watched together, one status per
// pipeline, and prompts (actions) to run against them. See docs/ci-board.md.
service CiBoardService {
  // Streams the board whenever it changes. While anyone is subscribed, the
  // board polls at its faster on-screen rate.
  rpc subscribeToCiBoard(EmptyRequest) returns (stream CiBoardState);
  // Adds a pull request link, a branch or a repository's open PRs. Returns
  // the target's id; adding the same selection twice returns the first one.
  rpc addCiTarget(AddCiTargetRequest) returns (String);
  // Removes a target by id.
  rpc removeCiTarget(StringRequest) returns (Empty);
  // Changes a target's auto-watch switch, actions or PR filter.
  rpc updateCiTarget(UpdateCiTargetRequest) returns (Empty);
  // Fetches a target (by id) or, for an empty id, every target now.
  rpc refreshCiBoard(StringRequest) returns (Empty);
  // Starts an action on an item: gets a working copy for its branch and starts
  // a conversation there. Returns the conversation id.
  rpc runCiAction(RunCiActionRequest) returns (String);
  // Opens the conversation an action last started for an item (by item key).
  rpc openCiConversation(StringRequest) returns (Empty);
  // Opens a file picker for a prompt file. An empty path means cancelled.
  rpc pickCiPromptFile(EmptyRequest) returns (String);
  // The window's git repositories that the board can watch.
  rpc listCiRepos(EmptyRequest) returns (CiRepoList);
  // Analyses an item's failures again now; the result arrives with the board.
  rpc analyzeCiItem(CiItemRequest) returns (Empty);
  // Runs a prompt typed or picked for this run only, like an action. Returns
  // the conversation id; save_as also keeps it as an action of the target.
  rpc runCiCustomPrompt(RunCiCustomPromptRequest) returns (String);
}

message CiBoardState {
  repeated CiTargetView targets = 1;
  // GitHub's rate limit is low, so the board polls less.
  bool rate_limited = 2;
  // Why the board cannot be used right now; empty when it can.
  string unavailable = 3;
}

message CiTargetView {
  string id = 1;
  // "pr", "branch" or "repo".
  string kind = 2;
  // e.g. "octo/hello #12", "octo/hello @ feature" or "octo/hello: my open PRs".
  string label = 3;
  string remote_url = 4;
  // "github" or "ado".
  string provider = 5;
  // The local checkout runs use; empty when this window has none.
  string checkout = 6;
  string branch = 7;
  int64 pr_id = 8;
  // "mine" or "all", for "repo" targets.
  string pr_filter = 9;
  reserved 10;
  reserved "autonomy";
  repeated CiActionInfo actions = 11;
  repeated CiItem items = 12;
  string error = 13;
  // True until the first fetch ends.
  bool loading = 14;
  // Fixes conflicts and recalibrates small test deltas on its own.
  bool auto_watch = 15;
  // The repository's skills that fit the built-in actions.
  repeated CiSkillInfo skills = 16;
}

message CiSkillInfo {
  // The built-in action the skill fits.
  string action_id = 1;
  string name = 2;
  string path = 3;
}

message CiActionInfo {
  string id = 1;
  string label = 2;
  // "builtin", "file" or "text".
  string prompt_kind = 3;
  // The file path or the text; the built-in prompt's id for "builtin".
  string prompt_value = 4;
  reserved 5;
  reserved "trigger";
  // "free" (the free auto-router) or "current" (the chat's model).
  string model = 6;
  // When it is the row's main button: "conflict", "small-delta", "failure" or "any".
  string situation = 7;
  // Auto-watch may start it (fix-conflicts and recalibrate only).
  bool auto = 8;
  // One of the board's own actions, which cannot be removed.
  bool builtin = 9;
}

message CiItem {
  // Stable across targets: the same PR listed twice shares its conversation.
  string key = 1;
  // 0 for a branch without a pull request.
  int64 pr_id = 2;
  string title = 3;
  string url = 4;
  string source_branch = 5;
  string target_branch = 6;
  string author = 7;
  bool draft = 8;
  // "open", "merged" or "closed"; empty for a branch.
  string state = 9;
  string head_sha = 10;
  // "clean", "conflicts", "pending", "unknown" or empty.
  string merge_state = 11;
  repeated CiPipeline pipelines = 12;
  // The conversation an action last started for this item.
  string conversation_id = 13;
  // "running", "background" or "idle"; empty without a conversation.
  string conversation_status = 14;
  // True while watch_ci watches that conversation.
  bool watching = 15;
  // Why an action cannot run on this item; empty when it can.
  string run_blocked = 16;
  string error = 17;
  // What the board worked out about the failures; unset when there are none.
  optional CiTriage triage = 18;
  // What auto-watch is doing about this item; unset when it is off.
  optional CiAutoStatus auto = 19;
  // The actions in the order the row offers them; the first may be its main button.
  repeated CiItemAction actions = 20;
  // One per problem: the merge conflicts, then each failed pipeline, with the fix that fits it.
  repeated CiPipelineFix fixes = 21;
  // The action and pipeline the item's conversation was started for; empty when unknown.
  string run_action_id = 22;
  string run_pipeline = 23;
}

// One problem of an item and the single fix that fits it, for the row's
// expanded, pipeline-by-pipeline view.
message CiPipelineFix {
  // The failed pipeline; empty for the pull request's merge conflicts.
  string pipeline = 1;
  // What is wrong, e.g. "Has conflicts", "Build failed", "Small test delta".
  string problem = 2;
  // The triage's category, "conflict", or "failed" before the triage has one.
  string category = 3;
  // The action that fixes it, scoped to the pipeline; empty when none fits (infrastructure, a stale run).
  string action_id = 4;
  string label = 5;
  string tooltip = 6;
  // Why it cannot run now; empty when it can.
  string disabled_reason = 7;
  // Other actions that can run on this pipeline alone, for when the triage is wrong.
  repeated string alternatives = 8;
}

message CiTriage {
  // "pending", "done" or "deferred" (rate limit low: names only).
  string status = 1;
  // "blocker", "high", "medium", "low" or "info".
  string severity = 2;
  string summary = 3;
  // "model" (a free model) or "heuristic" (rules on job and error text).
  string source = 4;
  int64 analyzed_ts = 5;
  // The full markdown report, when the details did not fit the board.
  string report_path = 6;
  // It describes an older state of the item (another commit or set of runs).
  bool stale = 7;
  repeated CiPipelineTriage pipelines = 8;
  // Built-in action ids that fit, best first.
  repeated string recommended = 9;
  string error = 10;
  bool conflict = 11;
}

message CiPipelineTriage {
  string name = 1;
  // "build", "test-regression", "small-test-delta", "infrastructure", "stale" or "unknown".
  string category = 2;
  string summary = 3;
  int64 run_id = 4;
  string url = 5;
  repeated CiFailedStep steps = 6;
}

message CiFailedStep {
  string job = 1;
  string step = 2;
  repeated string errors = 3;
  // The log lines around the error.
  string excerpt = 4;
}

message CiAutoStatus {
  // "running", "queued", "waiting_slot", "waiting_ci", "capped", "needs_you" or "idle".
  string status = 1;
  string action_id = 2;
  int32 attempt = 3;
  int32 max_attempts = 4;
  string message = 5;
}

message CiItemAction {
  string action_id = 1;
  string label = 2;
  // "primary" (the row's main button) or "menu".
  string role = 3;
  // The triage says it fits the failures.
  bool recommended = 4;
  string description = 5;
  string tooltip = 6;
  // Why it cannot run now; empty when it can.
  string disabled_reason = 7;
  // The one pipeline it runs on, when it is scoped to one; empty for the whole pull request.
  string pipeline = 8;
}

message CiPipeline {
  string name = 1;
  // "green", "red", "yellow" or "grey".
  string color = 2;
  // "queued", "in_progress", "completed", or empty without a run.
  string status = 3;
  string result = 4;
  int64 run_id = 5;
  string url = 6;
}

message AddCiTargetRequest {
  Metadata metadata = 1;
  // "pr", "branch" or "repo".
  string kind = 2;
  // The pull request link ("pr") or the branch name ("branch").
  string input = 3;
  // The repository folder, for "branch" and "repo".
  string repo_root = 4;
  // "mine" or "all", for "repo".
  string pr_filter = 5;
}

message UpdateCiTargetRequest {
  Metadata metadata = 1;
  string id = 2;
  reserved 3;
  reserved "autonomy";
  // Replaces the actions when set_actions is true.
  repeated CiActionInfo actions = 4;
  bool set_actions = 5;
  optional string pr_filter = 6;
  optional bool auto_watch = 7;
}

message CiItemRequest {
  Metadata metadata = 1;
  string target_id = 2;
  string item_key = 3;
}

message RunCiCustomPromptRequest {
  Metadata metadata = 1;
  string target_id = 2;
  string item_key = 3;
  // "text" or "file".
  string prompt_kind = 4;
  string prompt_value = 5;
  // "free" or "current".
  string model = 6;
  // When not empty, the prompt is also saved as an action with this name.
  string save_as = 7;
}

message RunCiActionRequest {
  Metadata metadata = 1;
  string target_id = 2;
  string item_key = 3;
  string action_id = 4;
  // Scopes the run to one of the item's pipelines; empty for the whole pull request.
  string pipeline = 5;
}

message CiRepoList {
  repeated CiRepo repos = 1;
}

message CiRepo {
  string root = 1;
  string remote_url = 2;
  // "github" or "ado".
  string provider = 3;
  // Empty when HEAD is detached.
  string current_branch = 4;
}
