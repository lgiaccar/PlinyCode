version: 2
updates:
    # The root bun.lock is the only lockfile in the workspace (sdk/packages/*,
    # apps/vscode and webview-ui resolve through it), so one entry at "/" covers
    # every package. Security updates only: the ignore rule below drops every
    # version update, and security updates bypass ignore rules.
    - package-ecosystem: "bun"
      directory: "/"
      schedule:
          interval: "weekly"
      # Group all updates into a single PR
      groups:
          all-dependencies:
              patterns:
                  - "*"
      ignore:
          - dependency-name: "*"
            update-types:
                - "version-update:semver-major"
                - "version-update:semver-minor"
                - "version-update:semver-patch"

    # Actions used by .github/workflows/* and by the composite action in
    # .github/actions/*. Security updates only, like the packages above.
    - package-ecosystem: "github-actions"
      directories:
          - "/"
          - "/.github/actions/*"
      schedule:
          interval: "weekly"
      groups:
          all-actions:
              patterns:
                  - "*"
      ignore:
          - dependency-name: "*"
            update-types:
                - "version-update:semver-major"
                - "version-update:semver-minor"
                - "version-update:semver-patch"
