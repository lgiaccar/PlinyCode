name: Bug report
description: Something in PlinyCode does not work as expected
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for the report. Before filing, check that the bug still happens on the newest
              [release](https://github.com/lgiaccar/PlinyCode/releases) (PlinyCode → Check for Updates).
    - type: input
      id: plinycode-version
      attributes:
          label: PlinyCode version
          description: Shown in PlinyCode's Settings → About ("PlinyCode vX.Y.Z") and in the Extensions view. Include the `-test.N` suffix for a pre-release.
          placeholder: "e.g. 0.2.3 or 0.2.3-test.2"
      validations:
          required: true
    - type: dropdown
      id: editor
      attributes:
          label: Editor
          options:
              - VS Code
              - Cursor
              - Other (say which in the description)
          default: 0
      validations:
          required: true
    - type: input
      id: model
      attributes:
          label: Model id
          description: The model selected in the chat's model picker when the bug happened, as shown in Settings → Models.
          placeholder: "e.g. pliny/free-auto, pliny/balance-auto, snps-aws-bedrock/aws-claude-sonnet-4.6, openai/gpt-5.4"
      validations:
          required: true
    - type: dropdown
      id: router
      attributes:
          label: Auto-router
          description: Were you on one of the auto-routers, which pick the model per request?
          options:
              - FreeAuto (pliny/free-auto)
              - BalanceAuto (pliny/balance-auto)
              - No, a specific model
              - Not sure
          default: 3
      validations:
          required: true
    - type: dropdown
      id: mode
      attributes:
          label: Mode
          options:
              - Agent
              - Plan
              - Ask
              - Not relevant
          default: 0
      validations:
          required: false
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: What did you see, and what did you expect instead?
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to reproduce
          value: |
              1.
              2.
              3.
      validations:
          required: false
    - type: textarea
      id: diagnostics
      attributes:
          label: Diagnostics
          description: |
              Paste what applies. Remove anything confidential (prompts, file contents, tokens) before posting.
              - Editor build: `Help → About` (Windows/Linux) or `Code → About Visual Studio Code` (macOS), then **Copy**.
              - The **PlinyCode** output channel (View → Output, pick PlinyCode) around the time of the bug.
              - For wrong or stalled model answers: the **PlinyCode: Show Last Model Request (debug)** command's output.
              - For a tool or terminal problem: the error shown in the chat and the command that ran.
          render: text
      validations:
          required: false
    - type: input
      id: os
      attributes:
          label: Operating system
          placeholder: "e.g. Windows 11, macOS 15, Ubuntu 24.04"
      validations:
          required: false
