name: engine-test

# Runs on PRs and on every push to stage (the PR target) and master, so a merge
# that breaks the engine is caught after it lands too. The path filter applies
# to pushes as well as PRs: a push that touches none of these paths skips the
# workflow entirely (no run, no check). `sdk/**` includes the eval harness in
# sdk/scripts/eval (cases, fixtures, cassettes), which the eval-offline job runs.
on:
    push:
        branches:
            - master
            - stage
        paths:
            - "sdk/**"
            - "bun.lock"
            - ".github/workflows/engine-test.yml"
            - ".github/actions/**"
    workflow_dispatch:
    pull_request:
        paths:
            - "sdk/**"
            - "bun.lock"
            - ".github/workflows/engine-test.yml"
            - ".github/actions/**"
    workflow_call:

# A new push to a PR cancels the PR's running checks; pushes to stage and
# master each get a full run so every merged commit has a result.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    quality-checks:
        runs-on: ubuntu-latest
        name: Quality Checks
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain

            # The one SDK build of this run: the test legs and eval-offline, which
            # all wait for this job, download its dist/ instead of rebuilding.
            - name: Build SDK
              run: bun run build:sdk

            - name: Share SDK dist
              uses: ./.github/actions/sdk-dist
              with:
                  mode: upload
                  name: sdk-dist-engine

            - name: Typecheck
              run: bun run types

            - name: Lint & Format
              run: |
                  bun run lint
                  bun run format

    test:
        needs: quality-checks
        strategy:
            fail-fast: false
            # Node 22 is the extension host's runtime and the .tool-versions pin;
            # the Node 24 entry keeps the SQLite smoke test covered on the next
            # major (the engine tests themselves run under bun).
            matrix:
                include:
                    - os: ubuntu-latest
                      node-version: "22.x"
                    - os: windows-latest
                      node-version: "22.x"
                    - os: ubuntu-latest
                      node-version: "24.x"
        runs-on: ${{ matrix.os }}
        name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  node-version: ${{ matrix.node-version }}

            # dist/ built by quality-checks on Ubuntu. It is plain JS and .d.ts
            # with LF endings, so the Windows leg uses the same files.
            - name: Restore SDK dist
              id: build_sdk_step
              uses: ./.github/actions/sdk-dist
              with:
                  mode: download
                  name: sdk-dist-engine

            # This workflow only triggers on sdk/** changes, so it tests the SDK
            # packages on both runners. The extension (plinycode-dev) is covered by
            # ext-vscode-test.yml, which provides the xvfb display its
            # vscode-test integration suite needs on Linux.
            - name: Run Tests
              if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' }}
              run: bun -F './sdk/packages/**' test

            - name: Smoke test SQLite under Node
              if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && matrix.os != 'windows-latest' }}
              timeout-minutes: 10
              run: bun sdk/scripts/ci-node-smoke.ts

    # Replays every eval case in sdk/scripts/eval from its committed cassette:
    # a real engine session with the default tools against a fixture copy, no
    # network. A case fails when an assertion fails or the agent does not
    # finish. See docs/eval-harness.md.
    eval-offline:
        needs: quality-checks
        runs-on: ubuntu-latest
        name: Eval (offline)
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup toolchain
              uses: ./.github/actions/setup-toolchain

            # Under Bun the harness runs engine source through sdk/tsconfig.json's
            # paths, but @plinycode/llms still resolves @plinycode/shared to dist/,
            # which quality-checks built.
            - name: Restore SDK dist
              uses: ./.github/actions/sdk-dist
              with:
                  mode: download
                  name: sdk-dist-engine

            - name: Typecheck eval harness
              run: bun tsc -p sdk/scripts/eval/tsconfig.json

            - name: Run offline eval cases
              run: bun sdk/scripts/eval/run.ts --offline

            - name: Upload eval results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: eval-results
                  path: ai_output/eval/
                  if-no-files-found: ignore
