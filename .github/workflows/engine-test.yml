name: engine-test

on:
    push:
        branches:
            - master
        paths:
            - "sdk/**"
            - ".github/workflows/engine-test.yml"
    workflow_dispatch:
    # No workflow-level path filter on pull_request: a filtered-out workflow never
    # reports its checks, which leaves required checks pending forever. The
    # detect-changes job below skips the real work instead, and the "engine-test
    # gate" job always reports a result for the ruleset to require.
    pull_request:
    workflow_call:

permissions:
    contents: read
    pull-requests: read # Needed for changed-file detection on pull requests

defaults:
    run:
        working-directory: .

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        name: Detect Changes
        outputs:
            sdk: ${{ steps.force.outputs.run_all == 'true' || steps.filter.outputs.sdk == 'true' }}
        steps:
            - id: force
              if: github.event_name != 'pull_request'
              run: echo "run_all=true" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@v4
              if: steps.force.outputs.run_all != 'true'

            - uses: dorny/paths-filter@v3
              if: steps.force.outputs.run_all != 'true'
              id: filter
              with:
                  filters: |
                      sdk:
                          - 'sdk/**'
                          - '.github/workflows/engine-test.yml'

    quality-checks:
        needs: detect-changes
        if: needs.detect-changes.outputs.sdk == 'true'
        runs-on: ubuntu-latest
        name: Quality Checks
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            - name: Install dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Typecheck
              run: |
                  bun run build:sdk
                  bun run types

            - name: Lint & Format
              run: |
                  bun run lint
                  bun run format

    test:
        needs: [detect-changes, quality-checks]
        if: needs.detect-changes.outputs.sdk == 'true'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      node-version: "24.x"
                    - os: windows-latest
                      node-version: "24.x"
        runs-on: ${{ matrix.os }}
        name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: bun install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build SDK
              id: build_sdk_step
              run: bun run build:sdk

            # This workflow only triggers on sdk/** changes, so it tests the SDK
            # packages on both runners. The extension (claude-dev) is covered by
            # ext-vscode-test.yml, which provides the xvfb display its
            # vscode-test integration suite needs on Linux.
            - name: Run Tests
              if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' }}
              run: bun -F './sdk/packages/**' test

            - name: Smoke test SQLite under Node
              if: ${{ !cancelled() && steps.build_sdk_step.outcome == 'success' && matrix.os != 'windows-latest' }}
              timeout-minutes: 10
              run: bun sdk/scripts/ci-node-smoke.ts

    # Always-reporting gate for the stage ruleset. Required checks must report on
    # every PR, and a skipped matrix job does not report under its expanded name,
    # so the ruleset requires this job instead of the individual jobs above.
    gate:
        needs: [detect-changes, quality-checks, test]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        name: engine-test gate
        steps:
            - name: Verify selected engine jobs
              env:
                  DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
                  SDK_CHANGED: ${{ needs.detect-changes.outputs.sdk }}
                  QUALITY_CHECKS_RESULT: ${{ needs.quality-checks.result }}
                  TEST_RESULT: ${{ needs.test.result }}
              run: |
                  if [ "$DETECT_CHANGES_RESULT" != "success" ]; then
                    echo "detect-changes did not succeed: $DETECT_CHANGES_RESULT"
                    exit 1
                  fi

                  if [ "$SDK_CHANGED" != "true" ]; then
                    echo "No sdk/** changes; engine tests not required."
                    exit 0
                  fi

                  if [ "$QUALITY_CHECKS_RESULT" != "success" ]; then
                    echo "quality-checks did not succeed: $QUALITY_CHECKS_RESULT"
                    exit 1
                  fi

                  if [ "$TEST_RESULT" != "success" ]; then
                    echo "test did not succeed: $TEST_RESULT"
                    exit 1
                  fi

                  echo "Engine jobs passed."
