name: ext-vscode-test-e2e

# Runs on PRs and on every push to stage (the PR target) and master. A push
# runs every job (detect-changes forces run_all); PRs go through the path
# filter below.
on:
    push:
        branches:
            - master
            - stage
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review]
    workflow_dispatch:

# A new push to a PR cancels the PR's running checks; pushes to stage and
# master each get a full run so every merged commit has a result.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    pull-requests: read

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        name: Detect Changes
        outputs:
            e2e: ${{ steps.force.outputs.run_all == 'true' || steps.filter.outputs.e2e == 'true' }}
        steps:
            - id: force
              if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              run: echo "run_all=true" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@v4
              if: steps.force.outputs.run_all != 'true'

            - uses: dorny/paths-filter@v3
              if: steps.force.outputs.run_all != 'true'
              id: filter
              with:
                  filters: |
                      e2e:
                          - 'apps/vscode/src/**'
                          - 'apps/vscode/webview-ui/**'
                          - 'apps/vscode/proto/**'
                          - 'apps/vscode/tests/**'
                          - 'apps/vscode/scripts/**'
                          - 'apps/vscode/assets/**'
                          - 'apps/vscode/walkthrough/**'
                          - 'apps/vscode/package.json'
                          - 'apps/vscode/webview-ui/package.json'
                          # Root bun lockfile is authoritative for the whole workspace (incl. apps/vscode).
                          - 'bun.lock'
                          # SDK source packages are local workspace symlinks (@plinycode/*), so SDK changes affect the build.
                          - 'sdk/packages/**'
                          - 'apps/vscode/buf.yaml'
                          - 'apps/vscode/tsconfig*.json'
                          - 'apps/vscode/biome.jsonc'
                          - 'apps/vscode/esbuild.mjs'
                          - 'apps/vscode/bunfig.toml'
                          - 'apps/vscode/.vscode-test.mjs'
                          - 'apps/vscode/.vscodeignore'
                          - 'apps/vscode/playwright*.ts'
                          - '.github/workflows/ext-vscode-test-e2e.yml'
                          - '.github/actions/**'

    # Always runs, so the e2e matrix always expands (see the e2e job).
    matrix_prep:
        needs: detect-changes
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - id: set-matrix
              run: |
                  echo 'matrix=[{"runner":"ubuntu"},{"runner":"windows"},{"runner":"macos"}]' >> $GITHUB_OUTPUT

    # "e2e (ubuntu)", "e2e (windows)" and "e2e (macos)" are required checks on
    # stage. A job-level `if` that skips a matrix job reports one check under the
    # unexpanded name "e2e", so the required names never arrive and a PR that
    # changes no extension path stays blocked forever. Instead the matrix always
    # expands: without relevant changes each leg runs on a cheap Ubuntu runner,
    # skips every step after the first, and reports success.
    e2e:
        needs: [detect-changes, matrix_prep]
        env:
            RUN_E2E: ${{ needs.detect-changes.outputs.e2e }}
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
        runs-on: ${{ needs.detect-changes.outputs.e2e == 'true' && format('{0}-latest', matrix.runner) || 'ubuntu-latest' }}
        timeout-minutes: 20
        # Nothing in this job uses OIDC, so it does not need an id-token
        # permission.
        permissions:
            contents: read
        defaults:
            run:
                working-directory: apps/vscode
        steps:
            - name: No extension changes
              if: env.RUN_E2E != 'true'
              working-directory: ${{ github.workspace }}
              run: echo "No extension paths changed; nothing to test."

            - uses: actions/checkout@v4
              if: env.RUN_E2E == 'true'

            # Pinned Bun and Node (.tool-versions), Bun install cache and one root
            # `bun install --frozen-lockfile` for the whole workspace.
            - name: Setup toolchain
              if: env.RUN_E2E == 'true'
              uses: ./.github/actions/setup-toolchain

            # The cache keys below are exact-match only (no restore-keys prefix
            # fallbacks); a miss just means a cold install, which is acceptable.

            # Cache VS Code installation
            - name: Cache VS Code
              if: env.RUN_E2E == 'true'
              uses: actions/cache@v4
              id: vscode-cache
              with:
                  path: apps/vscode/.vscode-test
                  key: vscode-${{ runner.os }}-stable-${{ hashFiles('apps/vscode/.vscode-test.mjs', 'apps/vscode/package.json') }}

            # Cache Playwright browsers
            - name: Cache Playwright browsers
              if: env.RUN_E2E == 'true'
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: |
                      ~/.cache/ms-playwright
                      ~/Library/Caches/ms-playwright
                      ~/AppData/Local/ms-playwright
                  key: playwright-browsers-${{ runner.os }}-${{ hashFiles('bun.lock') }}

            # @plinycode/* are local workspace symlinks to source packages; build dist/
            # before building/packaging the extension for E2E. Each leg builds its
            # own: the build takes 10-20 s, and nothing runs before the legs that
            # could share it, so a separate build job would add a job start, a
            # toolchain setup and an upload (more than the build itself) in front of
            # every leg. engine-test and ext-vscode-test share theirs through
            # .github/actions/sdk-dist because a job there already runs first.
            - name: Build SDK packages
              if: env.RUN_E2E == 'true'
              working-directory: ${{ github.workspace }}
              run: bun run build:sdk

            # NOTE: vsce is no longer installed globally. @vscode/vsce is a workspace
            # devDependency of apps/vscode (resolved into node_modules/.bin), and the
            # `test:e2e:build` script invokes `vsce` via `bun run`, which puts the local
            # .bin on PATH. No global install needed.

            - name: Install xvfb on Linux
              if: env.RUN_E2E == 'true' && matrix.runner == 'ubuntu'
              run: sudo apt-get update && sudo apt-get install -y xvfb

            # Run optimized E2E tests (eliminates redundant builds)
            - name: Run E2E tests - Linux
              if: env.RUN_E2E == 'true' && matrix.runner == 'ubuntu'
              run: xvfb-run -a bun run test:e2e:optimal

            - name: Run E2E tests - Non-Linux
              if: env.RUN_E2E == 'true' && matrix.runner != 'ubuntu'
              run: bun run test:e2e:optimal

            # The PR build for testers. test:e2e:optimal packages dist/e2e.vsix with
            # `vsce package`, which runs the production build (vscode:prepublish),
            # the same recipe as `bun run release:package` apart from the README
            # swap. The Ubuntu leg attaches it to the run as
            # PlinyCode-<version>-pr<number>.vsix, also when a test failed (the
            # PR's checks say whether e2e passed); it is skipped when packaging
            # never got that far. The bundle is plain JavaScript, so the Ubuntu
            # package installs on every OS.
            - name: Name the PR build
              id: pr_vsix
              if: ${{ !cancelled() && env.RUN_E2E == 'true' && matrix.runner == 'ubuntu' && github.event_name == 'pull_request' && hashFiles('apps/vscode/dist/e2e.vsix') != '' }}
              shell: bash
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  name="PlinyCode-${version}-pr${PR_NUMBER}.vsix"
                  mkdir -p "$RUNNER_TEMP/pr-vsix"
                  cp dist/e2e.vsix "$RUNNER_TEMP/pr-vsix/$name"
                  echo "name=$name" >> "$GITHUB_OUTPUT"
                  echo "path=$RUNNER_TEMP/pr-vsix/$name" >> "$GITHUB_OUTPUT"

            # A .vsix is already a zip, so the artifact is stored uncompressed.
            - name: Upload the PR build
              id: pr_vsix_upload
              if: ${{ !cancelled() && steps.pr_vsix.outcome == 'success' }}
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.pr_vsix.outputs.name }}
                  path: ${{ steps.pr_vsix.outputs.path }}
                  if-no-files-found: error
                  retention-days: 14
                  compression-level: 0
                  overwrite: true

            - name: Explain how to install the PR build
              if: ${{ !cancelled() && steps.pr_vsix_upload.outcome == 'success' }}
              shell: bash
              env:
                  VSIX_NAME: ${{ steps.pr_vsix.outputs.name }}
                  VSIX_URL: ${{ steps.pr_vsix_upload.outputs.artifact-url }}
              run: |
                  {
                    echo "## PR build"
                    echo
                    echo "[\`${VSIX_NAME}\`](${VSIX_URL}) is attached to this run for 14 days."
                    echo "Download it (GitHub delivers it as a .zip; unzip it to get the .vsix), then in VS Code or Cursor"
                    echo "open **Extensions → ⋯ → Install from VSIX…**, pick the file and reload the window."
                    echo "Turn off \`plinycode.updates.enabled\` while you test it, or the updater replaces it with any newer published release."
                  } >> "$GITHUB_STEP_SUMMARY"

            # Repo-root relative: the job's `working-directory` default applies to `run`
            # steps only, so an apps/vscode-relative path here silently matches nothing
            # and every failing run uploads no recordings at all.
            - uses: actions/upload-artifact@v4
              if: ${{ failure() }}
              with:
                  name: playwright-recordings-${{ matrix.runner }}
                  path: |
                      apps/vscode/test-results/
