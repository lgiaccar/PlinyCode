name: desktop-test
on:
  pull_request:
    paths: ["apps/desktop/**", "apps/cli/**", "sdk/**", "bun.lock", ".github/workflows/desktop-test.yml", ".github/actions/**"]
  push:
    branches: [stage, master]
    paths: ["apps/desktop/**", "apps/cli/**", "sdk/**", "bun.lock", ".github/workflows/desktop-test.yml", ".github/actions/**"]
  workflow_dispatch:
    inputs:
      previous-installer-run:
        description: "Optional successful desktop-test run ID supplying the previous Windows installer for upgrade acceptance"
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ inputs.previous-installer-run || 'normal' }}
  cancel-in-progress: ${{ github.ref_name != 'stage' && github.ref_name != 'master' }}
jobs:
  ubuntu-desktop:
    if: ${{ !inputs.previous-installer-run }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ai_output/playwright
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Provision Ubuntu desktop test environment
        run: bash apps/desktop/tests/linux/install-deps.sh
      - name: Allow Chromium namespaces on disposable Ubuntu 24 runner
        if: matrix.os == 'ubuntu-24.04'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build engine
        run: bun run build:sdk
      - name: Check desktop types and formatting
        run: |
          bun -F @plinycode/desktop typecheck
          bun biome check apps/desktop/
      - name: Test desktop, Linux credentials and process lifecycle
        run: bun -F @plinycode/desktop test
      - name: Build desktop and install test browser
        run: |
          bun -F @plinycode/desktop setup
          bun -F @plinycode/desktop build
          cd apps/desktop
          bun x playwright install chromium
      - name: Electron acceptance tests with isolated keyring
        run: |
          bash apps/desktop/tests/linux/session.sh bun apps/desktop/tests/linux/credentials.ts
          bash apps/desktop/tests/linux/session.sh bun -F @plinycode/desktop test:e2e
          bash apps/desktop/tests/linux/session.sh bun -F @plinycode/desktop test:drafts
      - name: Signed-in browser companion acceptance tests
        run: bash apps/desktop/tests/linux/session.sh bun -F @plinycode/desktop test:browser
      - name: Build Ubuntu x64 packages
        run: bun -F @plinycode/desktop package:linux
      - name: Test deb install, replacement, removal and portable AppImage
        run: bash apps/desktop/tests/linux/packages.sh
      - name: Upload Ubuntu packages
        uses: actions/upload-artifact@v4
        with:
          name: PlinyCode-Desktop-${{ matrix.os }}-x64
          path: |
            apps/desktop/release/*-x64.deb
            apps/desktop/release/*-x64.AppImage
            apps/desktop/release/latest-linux.yml
            ai_output/linux-package-sha256.txt
      - name: Upload Ubuntu test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: |
            ai_output/desktop-e2e-*/**/*.png
            ai_output/desktop-drafts-*/**/*.png
            ai_output/desktop-browser-e2e-*/**/*.png
            ai_output/linux-package-sha256.txt
          if-no-files-found: ignore
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Build engine
        run: bun run build:sdk
      - name: Check desktop types
        run: bun -F @plinycode/desktop typecheck
      - name: Check desktop formatting and lint
        run: bun biome check apps/desktop/
      - name: Test desktop lifecycle, worktrees and MCP
        run: bun -F @plinycode/desktop test
      - name: Install desktop runtime
        run: bun -F @plinycode/desktop setup
      - name: Build desktop
        run: bun -F @plinycode/desktop build
      - name: Electron acceptance tests
        run: bun -F @plinycode/desktop test:e2e
      - name: Electron draft isolation acceptance tests
        run: bun -F @plinycode/desktop test:drafts
      - name: Install test browser
        working-directory: apps/desktop
        run: bun x playwright install chromium
      - name: Browser companion acceptance tests
        run: bun -F @plinycode/desktop test:browser
      - name: Build one-click Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun -F @plinycode/desktop package
      - name: Test installation, packaged app and uninstallation
        shell: pwsh
        env:
          PREVIOUS_INSTALLER_RUN: ${{ inputs.previous-installer-run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem apps/desktop/release/PlinyCode-Desktop-Setup-*-x64.exe | Select-Object -First 1
          if ($env:PREVIOUS_INSTALLER_RUN) {
            if ($env:PREVIOUS_INSTALLER_RUN -notmatch '^\d+$') { throw 'Expected a numeric workflow run ID.' }
            gh run download $env:PREVIOUS_INSTALLER_RUN --repo $env:GITHUB_REPOSITORY --name PlinyCode-Desktop-Windows-x64 --dir ai_output/previous-installer
            if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous installer.' }
            $previous = @(Get-ChildItem ai_output/previous-installer -Recurse -Filter 'PlinyCode-Desktop-Setup-*-x64.exe')
            if ($previous.Count -ne 1) { throw 'Expected exactly one previous installer.' }
            ./apps/desktop/tests/installer.ps1 -Installer $installer.FullName -PreviousInstaller $previous[0].FullName
          } else {
            ./apps/desktop/tests/installer.ps1 -Installer $installer.FullName
          }
      - name: Build unpublished self-update baseline
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun apps/desktop/scripts/update-baseline.ts
      - name: Test actual self-update with corrupt download recovery and saved history
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/release/PlinyCode-Desktop-Setup-*-x64.exe | Select-Object -First 1
          $baseline = Get-ChildItem ai_output/updater-baseline/PlinyCode-Desktop-Setup-0.0.0-x64.exe
          ./apps/desktop/tests/installer.ps1 -Installer $installer.FullName -PreviousInstaller $baseline.FullName -SelfUpdate
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PlinyCode-Desktop-Windows-x64
          path: |
            apps/desktop/release/PlinyCode-Desktop-Setup-*-x64.exe
            apps/desktop/release/latest.yml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-evidence
          path: |
            ai_output/desktop-e2e-*/**/*.png
            ai_output/desktop-drafts-*/**/*.png
            ai_output/desktop-browser-e2e-*/**/*.png
            ai_output/desktop-upgrade-*/**/*.png
          if-no-files-found: ignore
